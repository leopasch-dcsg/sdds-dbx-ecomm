[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdds"
description = "Python utilities and notebooks for the SDDS index comparison Databricks bundle."
version = "3.9.3"
requires-python = ">= 3.10"
dependencies = [
    "requests",
]

[project.urls]
Homepage = "https://github.com/dsg-tech/sdds-dbx-ecomm/"

[project.optional-dependencies]
dev = [
    "build",
    "setuptools>=68",
    "pytest==8.3",
    "pytest-mock==3.14",
    "coverage>=7.6.0, <8.0.0",
    "black>=24.2, <25.0",
    "flake8>=7.1, <8.0",
    "pre-commit>=3.8, <4.0",
    "databricks-sdk>=0.38, <0.40.0",
    "pyspark==3.5.4",
    "pandas==2.3.2",
    "pyarrow==21.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sdds*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
junit_suite_name = "sdds-tests"
markers = [
    "unit: marks a method or class as a unit test.",
    "integration: marks a method or class as an integration test.",
]

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.xml]
output = "coverage.xml"
