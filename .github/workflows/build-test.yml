name: Test and Run Code Analysis

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
  workflow_call:

env:
  PYTHON_VERSION: '3.12.4'

jobs:
  test-and-scan:
    name: "Unit Test and Run SonarQube Code Analysis"
    runs-on: [ self-hosted, Linux ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup JDK.
        uses: actions/setup-java@v4.2.2
        with:
          java-version: 11
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Upgrade PIP
        run: python -m pip install --upgrade pip

      - name: Install Test Packages
        run: pip install ".[dev]"

      - name: Install Setup Tools
        run: pip install setuptools wheel

      - name: Run Unit Tests
        env:
          # These ENV variables are required for the databricks-sdk module to self-init. Without these, it will raise
          # an error related to auth-strategy.
          DATABRICKS_HOST: 'https://mock-host.com'
          DATABRICKS_TOKEN: 'dapiMOCK-TOKEN'
        run: coverage run -m pytest -m unit

      - name: Create Coverage Report
        run: coverage xml

      - name: "Analyze Code"
        uses: SonarSource/sonarqube-scan-action@v2.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonar.dcsg.com/"
        with:
          args: >
            -Dsonar.python.version=3.12.4
            -Dsonar.projectKey=com.dsg.data.ecomm:ecmde-dbx-ecomm
            -Dsonar.sources=./src/
            -Dsonar.tests=./tests/
            -Dsonar.verbose=true
            -Dsonar.python.coverage.reportPaths=./coverage.xml