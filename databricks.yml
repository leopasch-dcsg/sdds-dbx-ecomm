artifacts:
  default:
    type: whl
    build: python -m build
    path: .
 
targets:
  local:
    presets:
      tags:
        project: ${var.team_code}
        env: "dev-local"
      trigger_pause_status: PAUSED
    mode: development
    default: false
    workspace:
      host: https://adb-7098146655993014.14.azuredatabricks.net/
    # variables:
      # When testing locally, you need to override the values below to point to your sandbox schemas. This is not an
      # exhaustive list of variables that need to be overridden, but a sample of some of the common ones.
      # sdds_bronze_catalog: "dev_sdds_db"
      # sdds_silver_catalog: "dev_sdds_db"
      # sdds_gold_catalog: "dev_sdds_db"
      # ecom_schema: "lpaschoal_gold"
