      # dq_result_table: "dev_sdds_db.common.dq_check_result"
      # dq_summary_table: "dev_sdds_db.common.dq_run_summary"
  development:
    presets:
      tags:
        project: ${var.team_code}
        env: "development"
    workspace:
      host: https://adb-7098146655993014.14.azuredatabricks.net/
    variables:
    #   dq_config_table: "dev_sdds_db.common.dq_rule_config"
    #   dq_result_table: "dev_sdds_db.common.dq_check_result"
    #   dq_summary_table: "dev_sdds_db.common.dq_run_summary"
      sdds_catalog: "dev_sdsc_db"

  qa:
    presets:
      tags:
        project: ${var.team_code}
        env: "qa"
    workspace:
      host: https://adb-1385312813035376.16.azuredatabricks.net/
    variables:
      dbx_env: QA

  production:
    presets:
      tags:
        project: ${var.team_code}
        env: "production"
      trigger_pause_status: UNPAUSED
    workspace:
      host: https://adb-3759157064858225.5.azuredatabricks.net/
    variables:
      dbx_env: PROD
      data_platform_sp_id: "7b983771-59e1-4b5a-a05d-85b198de757e"
      sdds_sp_id: "2b2a244a-a0f2-40c9-afaf-7b64b9a39705"
      sdds_catalog: "prod_sdsc_db"


 
    resources:
      jobs:
        sdds-ecomp-bq-egress:
          email_notifications:
            on_failure:
              - TechPT-DataEcommerce@dcsg.com
              - TCS_DataAnalytics_SupportTeam@dcsg.com
        sdds-fulfillment-order-silver:
          email_notifications:
            on_failure:
