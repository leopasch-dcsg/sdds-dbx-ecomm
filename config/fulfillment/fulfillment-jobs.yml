resources:
  jobs:
    ecmde-fulfillment-oso-staging-tables:
      name: ecmde-fulfillment-oso-staging-tables
      tags:
        job-group: "fulfillment"
        version: ${var.bundle_version}

      permissions:
        - group_name: ${var.admin_group_name}
          level: CAN_MANAGE
        - group_name: ${var.eng_group_name}
          level: CAN_MANAGE_RUN
        - group_name: ${var.l2_support_group_name}
          level: CAN_MANAGE_RUN
        - service_principal_name: ${var.data_platform_sp_id}
          level: CAN_MANAGE_RUN
      job_clusters:
        - job_cluster_key: fmod_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            apply_policy_default_values: false
            policy_id: ${var.job_cluster_policy_id}
            instance_pool_id: ${var.instance_pool_id}
            azure_attributes:
              first_on_demand: 1
              availability: ON_DEMAND_AZURE
            data_security_mode: USER_ISOLATION
            runtime_engine: STANDARD
            autoscale:
              min_workers: 5
              max_workers: 10
            spark_conf:
              workspace_path_prefix: ${var.workspace_path_prefix}
            custom_tags:
              TEAM_CODE: ${var.team_code}
      tasks:
        - task_key: fulfillment-order-fulfill-task
          job_cluster_key: fmod_cluster
          libraries:
            - whl: ../../dist/*.whl
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/ecmde_ecomm/fulfillment/notebooks/fulfillment_merge_notebook
            base_parameters:
              azure_kv_scope: ${var.azure_kv_scope}
              workspace_path_prefix: ${var.workspace_path_prefix}
              dbx_env: ${var.dbx_env}
              dbx_user_id: ${workspace.current_user.short_name}
              dbx_data_quality: silver
              dbx_merge_watermark_table_name: ${var.ecmde_silver_catalog}.${var.ecmde_silver_schema}.watermarks
              dbx_merge_source_catalog: ${var.oso_source_catalog}
              dbx_merge_source_schema: ${var.oso_source_schema}
              dbx_merge_source_table: ${var.oso_order_fulfill_source_table_name}
              dbx_merge_destination_catalog: ${var.ecmde_silver_catalog}
              dbx_merge_destination_schema: ${var.ecmde_silver_schema}
              dbx_merge_destination_table: ${var.oso_order_fulfill_silver_table_name}
              oso_source_catalog: ${var.oso_source_catalog}
              fit_source_catalog: ${var.fit_source_catalog}
              ecomp_catalog: ${var.ecomp_catalog}

        - task_key: fulfillment-order-sku-shipment-task
          job_cluster_key: fmod_cluster
          libraries:
            - whl: ../../dist/*.whl
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/ecmde_ecomm/fulfillment/notebooks/fulfillment_merge_notebook
            base_parameters:
              azure_kv_scope: ${var.azure_kv_scope}
