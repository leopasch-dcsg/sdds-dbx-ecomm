              dbx_merge_source_schema: ${var.oso_source_schema}
              dbx_merge_source_table: ${var.oso_order_fulfill_source_table_name}
              dbx_merge_destination_catalog: ${var.ecmde_silver_catalog}
              dbx_merge_destination_schema: ${var.ecmde_silver_schema}
