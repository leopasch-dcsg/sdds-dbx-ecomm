resources:
  jobs:
    sdds_index_comparison_job:
      name: sdds_index_comparison

      tags:
        job-group: sdds-index-comparison
        version: ${var.bundle_version}
        TEAM_CODE: ${var.team_code}
      queue:
        enabled: true
      environments:
        - environment_key: catalog_load_silver_environment
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED

      permissions:
        - group_name: ${var.admin_group_name}
          level: CAN_MANAGE_RUN
        - group_name: ${var.eng_group_name}
          level: CAN_MANAGE_RUN
        - group_name: ${var.ecmde_admin_group_name}
          level: CAN_MANAGE_RUN
        - group_name: ${var.ecmde_eng_group_name}
          level: CAN_MANAGE_RUN
        - service_principal_name: ${var.data_platform_sp_id}
          level: CAN_MANAGE_RUN

      # Runs daily at 04:00:21 America/New_York. Paused by default; unpause per target
      # via ${var.sdds_schedule_pause_status}. Development mode also pauses schedules.
      schedule:
        quartz_cron_expression: 21 0 4 * * ?
        timezone_id: America/New_York
        pause_status: ${var.sdds_schedule_pause_status}

      # Job-level parameter: extraction/partition date shared by every task. Defaults to the
      # job's start date so scheduled runs are self-partitioning; override for backfills.
      parameters:
        - name: extraction_date
          default: "{{job.start_time.iso_date}}"

      tasks:
        - task_key: catalog_load_bronze
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/sdds/sdds_comparison/notebooks/bronze/catalog-load-bronze
            source: WORKSPACE
          max_retries: 3
          min_retry_interval_millis: 900000
          health:
            rules:
              - metric: STREAMING_BACKLOG_RECORDS
                op: GREATER_THAN
                value: 1000000
          email_notifications:
            on_success:
              - leonardo.paschoal@dcsg.com
            on_failure:
              - leonardo.paschoal@dcsg.com
          existing_cluster_id: 0812-152951-77vhlhwi

        - task_key: catalog_load_inventory_bronze
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/sdds/sdds_comparison/notebooks/bronze/catalog-load-inventory-bronze
            source: WORKSPACE
          existing_cluster_id: 0812-152951-77vhlhwi

        - task_key: catalog_load_inventory_silver
          depends_on:
            - task_key: catalog_load_inventory_bronze
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/sdds/sdds_comparison/notebooks/silver/catalog-load-inventory-silver
            source: WORKSPACE
          existing_cluster_id: 0812-152951-77vhlhwi
        - task_key: catalog_load_silver
          depends_on:
            - task_key: catalog_load_bronze
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/sdds/sdds_comparison/notebooks/silver/catalog-load-silver
            source: WORKSPACE
          existing_cluster_id: 0812-152951-77vhlhwi

        - task_key: catalog_compare_run_id_style
          depends_on:
            - task_key: catalog_load_inventory_silver
            - task_key: catalog_load_silver
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/sdds/sdds_comparison/notebooks/gold/catalog-compare-run-id-style-optimized
            source: WORKSPACE
          existing_cluster_id: 0812-152951-77vhlhwi

        - task_key: catalog_stream_bronze
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/sdds/sdds_comparison/notebooks/bronze/catalog-stream-bronze
            source: WORKSPACE
          max_retries: 3
          min_retry_interval_millis: 900000
          health:
            rules:
              - metric: STREAMING_BACKLOG_RECORDS
                op: GREATER_THAN
                value: 1000000
          email_notifications:
            on_success:
              - leonardo.paschoal@dcsg.com
            on_failure:
              - leonardo.paschoal@dcsg.com
          existing_cluster_id: 0811-215511-4bazq276

        - task_key: catalog_stream_silver
          depends_on:
            - task_key: catalog_stream_bronze
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/sdds/sdds_comparison/notebooks/silver/catalog-stream-silver
            source: WORKSPACE
          existing_cluster_id: 0811-215511-4bazq276

        - task_key: catalog_compare_run_id_sku
          depends_on:
            - task_key: catalog_load_silver
            - task_key: catalog_stream_silver
            - task_key: catalog_load_inventory_silver
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/sdds/sdds_comparison/notebooks/gold/catalog-compare-run-id-sku-optimized
            source: WORKSPACE
          existing_cluster_id: 0811-215511-4bazq276

        - task_key: catalog_email_report_run_sku
          depends_on:
            - task_key: catalog_compare_run_id_sku
            - task_key: catalog_compare_run_id_style
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/sdds/sdds_comparison/notebooks/gold/catalog-email-report-sku
            source: WORKSPACE
          existing_cluster_id: 0811-215511-4bazq276
          email_notifications:
            on_success:
              - Jitendra.Patel2@dcsg.com
              - rafael.miranda@dcsg.com
              - Rohit.Agarwal@dcsg.com
              - Paul.Perugini@dcsg.com
              - Leonardo.Paschoal@dcsg.com
              - Maria.DelCampo@dcsg.com
              - Raghu.Mummadi@dcsg.com
            on_failure:
              - Jitendra.Patel2@dcsg.com
              - rafael.miranda@dcsg.com
              - Rohit.Agarwal@dcsg.com
              - Paul.Perugini@dcsg.com
              - Leonardo.Paschoal@dcsg.com
              - Maria.DelCampo@dcsg.com
              - Raghu.Mummadi@dcsg.com
        - task_key: catalog_email_report_style
          depends_on:
            - task_key: catalog_compare_run_id_sku
            - task_key: catalog_compare_run_id_style
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/sdds/sdds_comparison/notebooks/gold/catalog-email-report-style
            source: WORKSPACE
          existing_cluster_id: 0812-152951-77vhlhwi

          email_notifications:
            on_success:
              - Jitendra.Patel2@dcsg.com
              - rafael.miranda@dcsg.com
              - Rohit.Agarwal@dcsg.com
              - Paul.Perugini@dcsg.com
              - Leonardo.Paschoal@dcsg.com
              - Maria.DelCampo@dcsg.com
              - Raghu.Mummadi@dcsg.com
            on_failure:
              - Jitendra.Patel2@dcsg.com
              - rafael.miranda@dcsg.com
              - Rohit.Agarwal@dcsg.com
              - Paul.Perugini@dcsg.com
              - Leonardo.Paschoal@dcsg.com
              - Maria.DelCampo@dcsg.com
              - Raghu.Mummadi@dcsg.com
        - task_key: flat_blended_comparison_gold
          depends_on:
            - task_key: catalog_load_silver
            - task_key: catalog_stream_silver
            - task_key: catalog_load_inventory_silver
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/sdds/sdds_comparison/notebooks/gold/flat_values
            source: WORKSPACE
          environment_key: catalog_load_silver_environment
        - task_key: unpublished_and_deleted_events
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/sdds/sdds_comparison/notebooks/bronze/unpub_and_deleted_events_mysq_bronze
            source: WORKSPACE
          existing_cluster_id: 0812-152951-77vhlhwi
