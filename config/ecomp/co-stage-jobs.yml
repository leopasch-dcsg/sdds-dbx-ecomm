resources:
  jobs:
    ecmde-ecomp-co-stage-dlt:
      name: ecmde-ecomp-co-stage-dlt

      tags:
        job-group: "co_stage"
        version: ${var.bundle_version}


      permissions:
        - group_name: ${var.admin_group_name}
          level: CAN_MANAGE
        - group_name: ${var.eng_group_name}
          level: CAN_MANAGE_RUN
        - group_name: ${var.l2_support_group_name}
          level: CAN_MANAGE_RUN
        - service_principal_name: ${var.data_platform_sp_id}
          level: CAN_MANAGE_RUN

      job_clusters:
        - job_cluster_key: co_stage_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            apply_policy_default_values: false
            policy_id: ${var.job_cluster_policy_id}
            instance_pool_id: ${var.instance_pool_id}
            azure_attributes:
              first_on_demand: 1
              availability: ON_DEMAND_AZURE
            data_security_mode: USER_ISOLATION
            runtime_engine: STANDARD
            autoscale:
              min_workers: 5
              max_workers: 10
            spark_conf:
              workspace_path_prefix: ${var.workspace_path_prefix}
            custom_tags: # Tag on DKS Job compute (Mandatory)
              TEAM_CODE: ${var.team_code}

      tasks:
        - task_key: ecomp-order-message-cancel-dlt-task
          timeout_seconds: ${var.co_stage_kafka_task_timeout_seconds}
          pipeline_task:
            pipeline_id: ${resources.pipelines.ecomp-order-message-cancel-dlt-pipeline.id}

        - task_key: ecomp-order-message-cancel-quarantine-task
          job_cluster_key: co_stage_cluster
          depends_on:
            - task_key: ecomp-order-message-cancel-dlt-task
          libraries:
            - whl: ../../dist/*.whl
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/ecmde_ecomm/ecomp/notebooks/co_stage/orders_merge_notebook
            base_parameters:
              azure_kv_scope: ${var.azure_kv_scope}
              workspace_path_prefix: ${var.workspace_path_prefix}
              dbx_env: ${var.dbx_env}
              dbx_user_id: ${workspace.current_user.short_name}
              dbx_data_quality: silver
              dbx_merge_watermark_table_name: ${var.ecmde_silver_catalog}.${var.ecmde_silver_schema}.watermarks
              dbx_merge_source_catalog: ${var.ecmde_bronze_catalog}
              dbx_merge_source_schema: ${var.ecmde_bronze_schema}
              dbx_merge_source_table: ${var.co_stage_order_message_cancel_bronze_table_name}
              dbx_merge_destination_catalog: ${var.ecmde_silver_catalog}
              dbx_merge_destination_schema: ${var.ecmde_silver_schema}
              dbx_merge_destination_table: ${var.co_stage_order_message_cancel_silver_quarantine_table_name}

        - task_key: ecomp-order-message-cancel-task
          job_cluster_key: co_stage_cluster
          depends_on:
            - task_key: ecomp-order-message-cancel-dlt-task
          libraries:
            - whl: ../../dist/*.whl
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/ecmde_ecomm/ecomp/notebooks/co_stage/orders_merge_notebook
