resources:
  jobs:
    ecmde-search-ltr-atc-price-feature-table-load:
      name: ecmde-search-ltr-atc-price-feature-table-load

      tags:
        job-type: "ltr-feature-table"
        job-group: "ltr"
        version: ${var.bundle_version}

      permissions:
        - group_name: ${var.admin_group_name}
          level: CAN_MANAGE
        - group_name: ${var.eng_group_name}
          level: CAN_MANAGE_RUN
        - service_principal_name: ${var.data_platform_sp_id}
          level: CAN_MANAGE_RUN
        - group_name: ${var.l2_support_group_name}
          level: CAN_MANAGE_RUN

      job_clusters:
        - job_cluster_key: ltr-feat-load-one
          new_cluster:
            spark_version: 15.4.x-scala2.12
            policy_id: ${var.ml_cluster_policy_id}
            apply_policy_default_values: false
            instance_pool_id: ${var.instance_pool_E16ads}
            driver_instance_pool_id: ${var.instance_pool_id}
            azure_attributes:
              first_on_demand: 1
              availability: ON_DEMAND_AZURE
            data_security_mode: USER_ISOLATION
            runtime_engine: PHOTON
            autoscale:
              min_workers: 1
              max_workers: 4
            spark_conf:
              spark.databricks.remoteFiltering.blockSelfJoins: false
              spark.databricks.photon.enabled: true
              spark.databricks.io.cache.enabled: true
              workspace_path_prefix: ${var.workspace_path_prefix}
            custom_tags: # Tag on DKS Job compute (Mandatory)
              TEAM_CODE: ${var.team_code}


        - job_cluster_key: ltr-feat-load-one-atc-z-score
          new_cluster:
            spark_version: 15.4.x-scala2.12
            apply_policy_default_values: false
            policy_id: ${var.ml_cluster_policy_id}
            instance_pool_id: ${var.instance_pool_E16ads}
            driver_instance_pool_id: ${var.instance_pool_id}
            azure_attributes:
              first_on_demand: 1
              availability: ON_DEMAND_AZURE
            data_security_mode: USER_ISOLATION
            runtime_engine: STANDARD
            autoscale:
              min_workers: 1
              max_workers: 4
            spark_conf:
              spark.databricks.remoteFiltering.blockSelfJoins: false
              spark.databricks.photon.enabled: true
              spark.databricks.io.cache.enabled: true
              workspace_path_prefix: ${var.workspace_path_prefix}
            custom_tags: # Tag on DKS Job compute (Mandatory)
              TEAM_CODE: ${var.team_code}

      tasks:
        - task_key: ltr_atc_prices_intermediary_table_trunc_and_load
          job_cluster_key: ltr-feat-load-one
          libraries:
            - whl: ../../dist/*.whl
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/ecmde_ecomm/search/notebooks/ltr_trunc_and_load_notebook
            base_parameters:
              azure_kv_scope: ${var.azure_kv_scope}
              workspace_path_prefix: ${var.workspace_path_prefix}
              dbx_user_id: ${workspace.current_user.short_name}
              ltr_load_destination_catalog: ${var.ltr_destination_catalog}
              ltr_load_destination_schema: ${var.ltr_destination_schema}
              ltr_load_destination_table: ${var.ltr_atc_prices_intermediary_table_name}
              ltr_lookback_days: ${var.atc_lookback_days}

        - task_key: ltr_atc_term_dates_intermediary_table_trunc_and_load
          job_cluster_key: ltr-feat-load-one
          depends_on:
            - task_key: ltr_atc_prices_intermediary_table_trunc_and_load
          libraries:
            - whl: ../../dist/*.whl
          notebook_task:
            notebook_path: ${var.workspace_path_prefix}/src/ecmde_ecomm/search/notebooks/ltr_trunc_and_load_notebook
            base_parameters:
              azure_kv_scope: ${var.azure_kv_scope}
              workspace_path_prefix: ${var.workspace_path_prefix}
              dbx_user_id: ${workspace.current_user.short_name}
              ltr_load_destination_catalog: ${var.ltr_destination_catalog}
              ltr_load_destination_schema: ${var.ltr_destination_schema}
              ltr_load_destination_table: ${var.ltr_atc_term_dates_intermediary_table_name}
              ltr_load_source_catalog: ${var.ltr_source_catalog}
              ltr_load_source_schema: ${var.ltr_source_schema}
              ltr_load_source_table: ${var.ltr_atc_prices_intermediary_table_name}
              ltr_lookback_days: ${var.atc_lookback_days}

        - task_key: ltr_atc_base_table_trunc_and_load
